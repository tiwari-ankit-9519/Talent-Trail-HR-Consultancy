spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  docker:
    compose:
      file: docker-compose.local.yml
      lifecycle-management: start-only
  application:
    name: abc-hr-platform
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        log_slow_query: ${SLOW_QUERY_MS:500}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  file:
    name: ${LOG_DIR:logs}/platform.log
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.abchr: ${LOG_LEVEL_APP:INFO}
    org.springframework.data.repository.config: WARN
    org.hibernate.SQL_SLOW: INFO
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL_PARAMS:INFO}

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  logging:
    service-name: ${SERVICE_NAME:abc-hr-platform}
    environment: ${APP_ENV:local}
    http-bodies-enabled: ${HTTP_BODIES_ENABLED:false}
    slow-request-ms: ${SLOW_REQUEST_MS:1000}
    sql:
      enabled: ${SQL_LOG_ENABLED:true}
      params: ${SQL_LOG_PARAMS:true}
      slow-ms: ${SLOW_QUERY_MS:500}
      many-queries: ${MANY_QUERIES_THRESHOLD:30}
      max-value-length: ${SQL_LOG_MAX_VALUE:120}
  commission:
    min-amount: ${COMMISSION_MIN_AMOUNT:2000}
    max-amount: ${COMMISSION_MAX_AMOUNT:5000}
  security:
    jwt-secret: ${JWT_SECRET}
    field-key: ${FIELD_ENCRYPTION_KEY}
    jwt-access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    jwt-refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  auth:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${AUTH_LOCK_MINUTES:15}
    rate-limit-attempts: ${AUTH_RATE_LIMIT_ATTEMPTS:30}
    rate-limit-window-minutes: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:10}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    base-path: ${STORAGE_BASE_PATH}
  mail:
    from: ${MAIL_FROM}
  reminders:
    cron: ${REMINDERS_CRON:0 0 9 * * *}
  monitoring:
    interval-ms: ${MONITOR_INTERVAL_MS:300000}
    alert-emails: ${ALERT_EMAILS:}
    min-free-disk-percent: ${MONITOR_MIN_FREE_DISK_PERCENT:15}
    outbox-stuck-minutes: ${MONITOR_OUTBOX_STUCK_MINUTES:10}
    reminder-hours: ${MONITOR_REMINDER_HOURS:6}
  outbox:
    exchange: ${OUTBOX_EXCHANGE:abchr.events}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
  apply:
    rate-limit-per-hour: ${APPLY_RATE_LIMIT_PER_HOUR:10}
  cache:
    default-ttl-seconds: ${CACHE_DEFAULT_TTL_SECONDS:600}
